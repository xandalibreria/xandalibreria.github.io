<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XandA Builder — Constructor visual de HTML/CSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1B4B;
  --ink-soft:#4B4880;
  --primary:#5B4FEB;
  --primary-dark:#4638D6;
  --primary-light:#7C6CF0;
  --violet:#6C5DD3;
  --lavender:#EDEBFC;
  --lavender-50:#F7F6FE;
  --line:#E4E1FA;
  --white:#FFFFFF;
  --gray:#6B7280;
  --danger:#EF4444;
  --success:#16A34A;
  --shadow-card: 0 10px 30px rgba(30,27,75,.08);
  --radius-lg: 18px;
  --radius-md: 12px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:var(--lavender-50);
  overflow:hidden;
}
h1,h2,h3,.brand,.tabbtn,.addbtn,.section-title{font-family:'Sora',sans-serif;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D7D2F7;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- layout shell ---------- */
.app{display:flex;flex-direction:column;height:100vh;}

/* ---------- header ---------- */
header.topbar{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;
  background:var(--white);
  border-bottom:1px solid var(--line);
  z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--ink);}
.brand .mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary-light),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 6px 14px rgba(91,79,235,.35);
}
.brand small{display:block;font-family:'Inter';font-weight:500;font-size:11.5px;color:var(--gray);margin-top:1px;}
.top-actions{display:flex;align-items:center;gap:10px;}
.device-toggle{display:flex;background:var(--lavender);border-radius:10px;padding:3px;gap:2px;}
.device-toggle button{
  border:none;background:transparent;padding:7px 11px;border-radius:8px;cursor:pointer;
  font-size:15px;color:var(--ink-soft);line-height:1;
}
.device-toggle button.active{background:var(--white);box-shadow:0 2px 6px rgba(30,27,75,.12);color:var(--primary);}
.btn{
  border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.96);}
.btn-ghost{background:var(--lavender);color:var(--primary-dark);}
.btn-ghost:hover{background:#E1DCFA;}
.btn-primary{
  background:linear-gradient(135deg,var(--primary-light),var(--primary-dark));
  color:#fff;box-shadow:0 8px 18px rgba(91,79,235,.35);
}
.btn-primary:hover{box-shadow:0 10px 22px rgba(91,79,235,.48);}

/* ---------- main grid ---------- */
.workspace{flex:1;display:flex;min-height:0;}

/* ---------- left sidebar ---------- */
.sidebar-left{
  width:272px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 14px 10px;}
.cat-chip{
  border:1px solid var(--line);background:var(--white);color:var(--ink-soft);
  padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:.15s;
}
.cat-chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.cat-chip:hover:not(.active){border-color:var(--primary-light);color:var(--primary-dark);}
.palette{flex:1;overflow-y:auto;padding:6px 14px 20px;display:flex;flex-direction:column;gap:8px;}
.palette-item{
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 12px;
  cursor:pointer;background:var(--white);transition:.15s;
}
.palette-item:hover{border-color:var(--primary-light);background:var(--lavender-50);transform:translateY(-1px);box-shadow:0 6px 14px rgba(91,79,235,.12);}
.palette-item .ic{
  width:34px;height:34px;border-radius:9px;background:var(--lavender);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--primary-dark);flex-shrink:0;
}
.palette-item .txt{flex:1;}
.palette-item .txt b{display:block;font-size:13.5px;font-weight:700;color:var(--ink);}
.palette-item .txt span{font-size:11.5px;color:var(--gray);}
.palette-item .plus{color:var(--primary);font-weight:800;font-size:17px;}

/* ---------- center canvas ---------- */
.center{flex:1;display:flex;flex-direction:column;min-width:0;background:
  radial-gradient(circle at 1px 1px, #E4E1FA 1px, transparent 0) 0 0/22px 22px, var(--lavender-50);
}
.canvas-toolbar{
  display:flex;align-items:center;justify-content:space-between;padding:12px 22px;
}
.canvas-toolbar .hint{font-size:12.5px;color:var(--gray);}
.canvas-wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:6px 26px 34px;}
.canvas-frame{
  background:var(--white);border-radius:20px;box-shadow:var(--shadow-card);
  width:100%;max-width:1040px;height:fit-content;min-height:520px;overflow:hidden;
  border:1px solid var(--line);transition:max-width .25s ease;
}
.canvas-frame.tablet{max-width:720px;}
.canvas-frame.mobile{max-width:390px;}
.canvas-frame iframe{width:100%;border:none;display:block;background:#fff;}
.empty-canvas{
  height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--gray);
  text-align:center;padding:30px;
}
.empty-canvas .big{font-size:38px;}
.empty-canvas b{color:var(--ink);font-size:16px;font-family:'Sora';}
.empty-canvas span{font-size:13px;max-width:280px;}

/* ---------- right sidebar ---------- */
.sidebar-right{
  width:328px;flex-shrink:0;background:var(--white);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.layers-box{border-bottom:1px solid var(--line);max-height:230px;display:flex;flex-direction:column;}
.layers-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
.layers-head b{font-size:13px;font-family:'Sora';}
.layers-head .count{background:var(--lavender);color:var(--primary-dark);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.layers-list{overflow-y:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:4px;}
.layer-row{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;
}
.layer-row:hover{background:var(--lavender-50);}
.layer-row.selected{background:var(--lavender);border-color:#D7CFF9;}
.layer-row .lic{font-size:13px;width:20px;text-align:center;color:var(--primary-dark);}
.layer-row .lname{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layer-row .lbtns{display:flex;gap:2px;opacity:0;}
.layer-row:hover .lbtns, .layer-row.selected .lbtns{opacity:1;}
.lbtns button{border:none;background:transparent;color:var(--gray);cursor:pointer;font-size:12px;padding:3px 5px;border-radius:5px;}
.lbtns button:hover{background:#E1DCFA;color:var(--primary-dark);}
.layers-empty{padding:16px;font-size:12px;color:var(--gray);text-align:center;}

.inspector{flex:1;display:flex;flex-direction:column;min-height:0;}
.tabs{display:flex;gap:4px;padding:12px 16px 0;}
.tabbtn{
  flex:1;border:none;background:transparent;padding:9px 4px;font-size:12.5px;font-weight:700;color:var(--gray);
  border-bottom:2px solid transparent;cursor:pointer;
}
.tabbtn.active{color:var(--primary-dark);border-color:var(--primary);}
.inspector-body{flex:1;overflow-y:auto;padding:14px 16px 24px;}
.no-selection{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--gray);text-align:center;padding:20px;
}
.no-selection .big{font-size:30px;}
.no-selection span{font-size:12.5px;max-width:220px;}

.section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);font-weight:700;margin:16px 0 8px;}
.section-title:first-child{margin-top:0;}
.field-label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:10px 0 5px;}
.field-input{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px;font-family:inherit;
  color:var(--ink);background:var(--white);resize:vertical;
}
.field-input:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(91,79,235,.14);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.range-row{display:flex;align-items:center;gap:8px;}
.range-row input[type=range]{flex:1;accent-color:var(--primary);}
.range-val{font-size:11.5px;font-weight:700;color:var(--primary-dark);width:42px;text-align:right;}
.color-row{display:flex;align-items:center;gap:8px;}
.color-row input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;cursor:pointer;background:#fff;}
.color-row input[type=text]{flex:1;}
.select-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px;background:#fff;color:var(--ink);}
.chip-select{display:flex;gap:6px;flex-wrap:wrap;}
.chip-select button{
  border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;
  color:var(--ink-soft);cursor:pointer;
}
.chip-select button.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.hint-box{background:var(--lavender-50);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}

/* ---------- code modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(30,27,75,.45);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:30px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--white);border-radius:20px;width:100%;max-width:820px;max-height:85vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(30,27,75,.35);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head b{font-family:'Sora';font-size:16px;}
.modal-head button{border:none;background:var(--lavender);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink-soft);}
.modal-tabs{display:flex;gap:6px;padding:14px 22px 0;}
.modal-tabs button{
  border:none;background:var(--lavender-50);color:var(--ink-soft);padding:8px 16px;border-radius:9px 9px 0 0;
  font-weight:700;font-size:12.5px;cursor:pointer;
}
.modal-tabs button.active{background:var(--ink);color:#fff;}
.modal-body{flex:1;overflow:auto;padding:0 22px 18px;}
.code-pre{
  background:var(--ink);color:#E4E1FA;border-radius:0 12px 12px 12px;padding:18px;font-size:12.5px;
  font-family:'SFMono-Regular',Consolas,monospace;white-space:pre-wrap;word-break:break-word;line-height:1.6;margin-top:0;
}
.modal-foot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);flex-wrap:wrap;}

/* wave divider under header, brand touch */
.wave{height:10px;width:100%;background:linear-gradient(90deg,#C7BFFA,#6C5DD3);}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark">X</div>
      <div>XandA Builder
        <small>Constructor visual de HTML &amp; CSS</small>
      </div>
    </div>
    <div class="top-actions">
      <div class="device-toggle" id="deviceToggle">
        <button data-d="desktop" class="active" onclick="setDevice('desktop')" title="Escritorio">🖥️</button>
        <button data-d="tablet" onclick="setDevice('tablet')" title="Tablet">📟</button>
        <button data-d="mobile" onclick="setDevice('mobile')" title="Móvil">📱</button>
      </div>
      <button class="btn btn-ghost" onclick="clearCanvas()">🗑️ Vaciar</button>
      <button class="btn btn-ghost" onclick="openCode()">{'}'} Código</button>
      <button class="btn btn-primary" onclick="downloadCombined()">⬇ Descargar</button>
    </div>
  </header>
  <div class="wave"></div>

  <div class="workspace">

    <!-- LEFT: component library -->
    <aside class="sidebar-left">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="palette" id="palette"></div>
    </aside>

    <!-- CENTER: canvas -->
    <main class="center">
      <div class="canvas-toolbar">
        <span class="hint">Haz clic en un elemento del lienzo para editarlo →</span>
        <span class="hint" id="elCount">0 elementos</span>
      </div>
      <div class="canvas-wrap">
        <div class="canvas-frame" id="canvasFrame">
          <iframe id="canvasIframe" scrolling="yes"></iframe>
        </div>
      </div>
    </main>

    <!-- RIGHT: layers + inspector -->
    <aside class="sidebar-right">
      <div class="layers-box">
        <div class="layers-head"><b>Capas</b><span class="count" id="layerCount">0</span></div>
        <div class="layers-list" id="layersList"></div>
      </div>
      <div class="inspector">
        <div class="tabs" id="inspTabs">
          <button class="tabbtn active" data-t="contenido" onclick="switchTab('contenido')">Contenido</button>
          <button class="tabbtn" data-t="estilo" onclick="switchTab('estilo')">Estilo</button>
          <button class="tabbtn" data-t="animacion" onclick="switchTab('animacion')">Animación</button>
        </div>
        <div class="inspector-body" id="inspectorBody"></div>
      </div>
    </aside>

  </div>
</div>

<!-- CODE MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <b>Tu código</b>
      <button onclick="closeCode()">✕</button>
    </div>
    <div class="modal-tabs" id="codeTabs">
      <button class="active" data-c="combinado" onclick="switchCodeTab('combinado')">Combinado</button>
      <button data-c="html" onclick="switchCodeTab('html')">HTML</button>
      <button data-c="css" onclick="switchCodeTab('css')">CSS</button>
    </div>
    <div class="modal-body">
      <pre class="code-pre" id="codeView"></pre>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="copyCode()">📋 Copiar</button>
      <button class="btn btn-primary" onclick="downloadCombined()">⬇ Descargar 1 archivo (HTML+CSS)</button>
      <button class="btn btn-ghost" onclick="downloadSeparate()">⬇ Descargar por separado</button>
    </div>
  </div>
</div>

<script>
/* ============================= STATE ============================= */
let elements = [];
let selectedId = null;
let idCounter = 0;
let activeCat = 'botones';
let activeTab = 'contenido';
let activeCodeTab = 'combinado';
let device = 'desktop';

/* ============================= HELPERS ============================= */
function esc(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(){ idCounter++; return 'xa' + idCounter; }
function findEl(id){ return elements.find(e=>e.id===id); }

/* ============================= DESIGN TOKENS ============================= */
const SHADOWS = {
  none:'none',
  sm:'0 1px 3px rgba(30,27,75,.10)',
  md:'0 10px 24px rgba(30,27,75,.14)',
  lg:'0 22px 44px rgba(30,27,75,.20)',
  glow:'0 0 0 4px rgba(91,79,235,.28), 0 14px 28px rgba(91,79,235,.28)'
};
const SHADOW_LABELS = {none:'Ninguna',sm:'Suave',md:'Media',lg:'Grande',glow:'Resplandor'};

const HOVER_FX = {
  none:'',
  scale:'transform:scale(1.05);',
  lift:'transform:translateY(-5px);box-shadow:0 20px 36px rgba(30,27,75,.22);',
  glow:'box-shadow:0 0 0 5px rgba(91,79,235,.32);',
  rotate:'transform:rotate(-2deg);',
  bright:'filter:brightness(1.12) saturate(1.1);'
};
const HOVER_LABELS = {none:'Ninguno',scale:'Escalar',lift:'Elevar',glow:'Brillo',rotate:'Rotar leve',bright:'Iluminar'};

const KEYFRAMES = {
  fadeIn:'@keyframes fadeIn{from{opacity:0}to{opacity:1}}',
  slideUp:'@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}',
  slideDown:'@keyframes slideDown{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:translateY(0)}}',
  zoomIn:'@keyframes zoomIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}',
  bounce:'@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}50%{transform:translateY(0)}70%{transform:translateY(-9px)}85%{transform:translateY(0)}}',
  rotateIn:'@keyframes rotateIn{from{opacity:0;transform:rotate(-10deg) scale(.9)}to{opacity:1;transform:rotate(0) scale(1)}}',
  pulseLoop:'@keyframes pulseLoop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}',
  shake:'@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}'
};
const ANIM_LABELS = {none:'Ninguna',fadeIn:'Aparecer (Fade In)',slideUp:'Deslizar arriba',slideDown:'Deslizar abajo',zoomIn:'Acercamiento (Zoom In)',bounce:'Rebote',rotateIn:'Girar al entrar',pulseLoop:'Pulso continuo',shake:'Vibración'};

const FULL = ['bg','color','fontSize','fontWeight','paddingV','paddingH','radius','border','shadow','width','align'];
const CONTAINER = ['bg','paddingV','paddingH','radius','border','shadow','width','align'];
const FORM_F = ['bg','color','fontSize','paddingV','paddingH','radius','border','width'];

function baseStyle(o){
  return Object.assign({
    bgType:'solid', bg:'#5B4FEB', gradientFrom:'#7C6CF0', gradientTo:'#4638D6',
    color:'#FFFFFF', fontSize:16, fontWeight:'600',
    paddingV:14, paddingH:28, radius:10,
    borderWidth:0, borderColor:'#5B4FEB',
    shadow:'md', width:'auto', widthPx:320, align:'left'
  }, o||{});
}
function defAnim(o){ return Object.assign({name:'none',duration:0.6,delay:0,timing:'ease-out',iteration:'1'}, o||{}); }
function defHover(o){ return Object.assign({effect:'none',duration:0.25}, o||{}); }

/* ============================= RENDER FUNCTIONS (canvas markup) ============================= */
function selAttr(id){ return `onclick="parent.postMessage({type:'select',id:'${id}'},'*')"`; }

function renderButton(el){
  return `<button class="el-${el.id}" data-id="${el.id}" ${selAttr(el.id)}>${esc(el.content.label)}</button>`;
}
function renderIconButton(el){
  return `<button class="el-${el.id}" data-id="${el.id}" ${selAttr(el.id)}><span style="margin-right:8px">${esc(el.content.icon)}</span>${esc(el.content.label)}</button>`;
}
function renderHero(el){
  const c = el.content;
  return `<div class="el-${el.id}" data-id="${el.id}" ${selAttr(el.id)} style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <h1 style="margin:0;font-size:38px;font-weight:800;line-height:1.15;color:inherit;font-family:'Sora',sans-serif;">${esc(c.title)}</h1>
    <p style="margin:0;font-size:16px;max-width:560px;line-height:1.6;opacity:.8;color:inherit;">${esc(c.subtitle)}</p>
    <button style="margin-top:6px;background:#5B4FEB;color:#fff;border:none;padding:14px 30px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 22px rgba(91,79,235,.35);">${esc(c.button)}</button>
  </div>`;
}
function renderCta(el){
  const c = el.content;
  return `<div class="el-${el.id}" data-id="${el.id}" ${selAttr(el.id)} style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;">
    <h2 style="margin:0;font-size:22px;font-weight:800;color:inherit;font-family:'Sora',sans-serif;">${esc(c.title)}</h2>
    <button style="background:#fff;color:#4638D6;border:none;padding:12px 24px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;">${esc(c.button)}</button>
  </div>`;
}
function renderFeatureRow(el){
  const c = el.content;
  const items = [['🎨',c.title1,c.text1],['⚡',c.title2,c.text2],['🧩',c.title3,c.text3]];
  const cols = items.map(([ic,t,tx])=>`
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="width:42px;height:42px;border-radius:11px;background:#EDEBFC;display:flex;align-items:center;justify-content:center;font-size:19px;">${ic}</div>
      <h3 style="margin:2px 0 0;font-size:16px;font-weight:700;color:inherit;font-family:'Sora',sans-serif;">${esc(t)}</h3>
      <p style="margin:0;font-size:13.5px;line-height:1.55;opacity:.75;color:inherit;">${esc(tx)}</p>
    </div>`).join('');
  return `<div class="el-${el.id}" data-id="${el.id}" ${selAttr(el.id)} style="display:grid;grid-template-columns:repeat(3,1fr);gap:26px;">${cols}</div>`;
}
function renderFooter(el){
  const c = el.content;
  return `<div class="el-${el.id}" data-id="${el.id}" ${selAttr(el.id)} style="text-align:center;">
    <p style="margin:0;font-size:13px;color:inherit;opacity:.85;">${esc(c.text)}</p>

function getTpl(tplKey){
  for(const cat in TEMPLATES){ const f = TEMPLATES[cat].items.find(i=>i.key===tplKey); if(f) return f; }
  return null;
}

/* ============================= ELEMENT CRUD ============================= */
function addElement(tplKey){
  const tpl = getTpl(tplKey);
  if(!tpl) return;
  const id = uid();
  elements.push({
    id, tplKey,
    label: tpl.label,
    icon: tpl.icon,
    content: JSON.parse(JSON.stringify(tpl.content)),
    style: JSON.parse(JSON.stringify(tpl.style)),
    animation: JSON.parse(JSON.stringify(tpl.animation)),
    hover: JSON.parse(JSON.stringify(tpl.hover))
  });
  selectedId = id;
  activeTab = 'contenido';
  renderAll();
}
function deleteElement(id){
  elements = elements.filter(e=>e.id!==id);
  if(selectedId===id) selectedId = null;
  renderAll();
}
function duplicateElement(id){
  const el = findEl(id);
  if(!el) return;
  const copy = JSON.parse(JSON.stringify(el));
  copy.id = uid();
  const idx = elements.findIndex(e=>e.id===id);
  elements.splice(idx+1,0,copy);
  selectedId = copy.id;
  renderAll();
}
function moveElement(id,dir){
  const idx = elements.findIndex(e=>e.id===id);
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=elements.length) return;
  const [it] = elements.splice(idx,1);
  elements.splice(newIdx,0,it);
  renderAll();
}
function selectElement(id){
  selectedId = id;
  activeTab = 'contenido';
  renderLayers();
  renderInspector();
}
function clearCanvas(){
  if(elements.length && !confirm('¿Vaciar todo el lienzo? Esta acción no se puede deshacer.')) return;
  elements = [];
  selectedId = null;
  renderAll();
}
function updateContent(id, field, value){
  const el = findEl(id); if(!el) return;
  el.content[field] = value;
  renderCanvas();
  renderLayers();
}
function updateStyle(id, prop, value){
  const el = findEl(id); if(!el) return;
  el.style[prop] = value;
  renderCanvas();
}
function updateAnim(id, prop, value){
  const el = findEl(id); if(!el) return;
  el.animation[prop] = value;
  renderCanvas();
}
function updateHover(id, prop, value){
  const el = findEl(id); if(!el) return;
  el.hover[prop] = value;
  renderCanvas();
}

/* ============================= CSS GENERATION ============================= */
function cssForElement(el){
  const s = el.style;
  const bgDecl = s.bgType==='gradient'
    ? `background: linear-gradient(135deg, ${s.gradientFrom}, ${s.gradientTo});`
    : `background: ${s.bg};`;
  const borderDecl = s.borderWidth>0 ? `border: ${s.borderWidth}px solid ${s.borderColor};` : 'border: none;';
  let widthDecl = 'width:auto;';
  if(s.width==='full') widthDecl = 'width:100%;';
  else if(s.width==='custom') widthDecl = `width:${s.widthPx}px;max-width:100%;`;
  const animDecl = (el.animation.name && el.animation.name!=='none')
    ? `animation: ${el.animation.name} ${el.animation.duration}s ${el.animation.timing} ${el.animation.delay}s ${el.animation.iteration==='infinite'?'infinite':'1'} both;`
    : '';
  let css = `.el-${el.id}{\n`;
  css += `  ${bgDecl}\n  color:${s.color};\n  font-size:${s.fontSize}px;\n  font-weight:${s.fontWeight};\n`;
  css += `  padding:${s.paddingV}px ${s.paddingH}px;\n  border-radius:${s.radius}px;\n  ${borderDecl}\n`;
  css += `  box-shadow:${SHADOWS[s.shadow]};\n  ${widthDecl}\n  text-align:${s.align};\n`;
  css += `  transition: all ${el.hover.duration}s ease;\n  ${animDecl}\n}\n`;
  if(el.hover.effect && el.hover.effect!=='none'){
    css += `.el-${el.id}:hover{\n  ${HOVER_FX[el.hover.effect]}\n}\n`;
  }
  return css;
}
function generateCSS(){
  let css = `/* Generado con XandA Builder */\n*{box-sizing:border-box;}\nbody{font-family:'Inter',sans-serif;margin:0;}\n`;
  css += `.el-btn-reset{border:none;cursor:pointer;font-family:inherit;}\n`;
  css += `button,input,textarea,select{font-family:inherit;cursor:pointer;}\n\n`;
  const used = new Set();
  elements.forEach(el=>{
    css += cssForElement(el) + '\n';
    if(el.animation.name && el.animation.name!=='none') used.add(el.animation.name);
  });
  if(used.size){
    css += '/* Animaciones */\n';
    used.forEach(name=>{ css += KEYFRAMES[name] + '\n'; });
  }
  return css;
}
function generateHTML(){
  return elements.map(el=>{
    const tpl = getTpl(el.tplKey);
    return '  ' + tpl.render(el);
  }).join('\n');
}
function generateCombined(){
  return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi sitio — XandA Builder</title>
<style>
${generateCSS()}
</style>
</head>
<body style="padding:40px;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px;">
${generateHTML()}
</body>
</html>`;
}

/* ============================= RENDER: LAYERS ============================= */
function renderLayers(){
  document.getElementById('layerCount').textContent = elements.length;
  const wrap = document.getElementById('layersList');
  document.getElementById('elCount').textContent = elements.length + (elements.length===1 ? ' elemento' : ' elementos');
  if(!elements.length){
    wrap.innerHTML = `<div class="layers-empty">Aún no hay elementos.<br>Añade uno desde la izquierda.</div>`;
    return;
  }
  wrap.innerHTML = elements.map((el,i)=>`
    <div class="layer-row ${el.id===selectedId?'selected':''}" onclick="selectElement('${el.id}')">
      <span class="lic">${el.icon}</span>
      <span class="lname">${el.label}</span>
      <span class="lbtns">
        <button title="Subir" onclick="event.stopPropagation();moveElement('${el.id}',-1)">↑</button>
        <button title="Bajar" onclick="event.stopPropagation();moveElement('${el.id}',1)">↓</button>
        <button title="Duplicar" onclick="event.stopPropagation();duplicateElement('${el.id}')">⧉</button>
        <button title="Eliminar" onclick="event.stopPropagation();deleteElement('${el.id}')">✕</button>
      </span>
    </div>`).join('');
}

${generateHTML()}
</body></html>`;
  iframe.srcdoc = doc;
  iframe.onload = ()=>{
    try{
      const h = iframe.contentDocument.body.scrollHeight;
      iframe.style.height = Math.max(h+10, 300) + 'px';
    }catch(e){}
  };
}

/* ============================= RENDER: INSPECTOR ============================= */
function switchTab(tab){ activeTab = tab; renderInspTabs(); renderInspector(); }
function renderInspTabs(){
  document.querySelectorAll('#inspTabs .tabbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.t===activeTab);
  });
}
function fieldControl(el, field, meta){
  const val = esc(el.content[field]);
  if(meta.t==='textarea'){
    return `<label class="field-label">${meta.l}</label><textarea class="field-input" rows="3" oninput="updateContent('${el.id}','${field}',this.value)">${val}</textarea>`;
  }
  return `<label class="field-label">${meta.l}</label><input class="field-input" type="text" value="${val}" oninput="updateContent('${el.id}','${field}',this.value)">`;
}
function rangeControl(id, prop, label, val, min, max, step, updater, unit){
  unit = unit||'';
  return `<label class="field-label">${label}</label>
  <div class="range-row">
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}"
      oninput="document.getElementById('rv-${prop}-${id}').textContent=this.value+'${unit}';${updater}(this.value)">
    <span class="range-val" id="rv-${prop}-${id}">${val}${unit}</span>
  </div>`;
}
function colorControl(id, prop, label, val, updater){
  return `<label class="field-label">${label}</label>
  <div class="color-row">
    <input type="color" value="${val}" oninput="${updater}(this.value); document.getElementById('ctxt-${prop}-${id}').value=this.value;">
    <input type="text" id="ctxt-${prop}-${id}" value="${val}" oninput="${updater}(this.value)">
  </div>`;
}
function renderInspector(){
  renderInspTabs();
  const body = document.getElementById('inspectorBody');
  const el = findEl(selectedId);
  if(!el){
    body.innerHTML = `<div class="no-selection"><div class="big">🖱️</div><b>Nada seleccionado</b><span>Haz clic en un elemento del lienzo o de la lista de capas para editarlo.</span></div>`;
    return;
  }
  const tpl = getTpl(el.tplKey);
  const sp = tpl.styleProps;

  if(activeTab==='contenido'){
    let html = `<div class="section-title">Contenido — ${el.label}</div>`;
    html += Object.entries(tpl.schema).map(([f,meta])=>fieldControl(el,f,meta)).join('');
    html += `<div class="hint-box">✏️ Los cambios se reflejan al instante en el lienzo.</div>`;
    body.innerHTML = html;
    return;
  }

  if(activeTab==='estilo'){
    const s = el.style;
    let html = `<div class="section-title">Fondo</div>`;
    if(sp.includes('bg')){
      html += `<div class="chip-select">
        <button class="${s.bgType==='solid'?'active':''}" onclick="updateStyle('${el.id}','bgType','solid');renderInspector();">Sólido</button>
        <button class="${s.bgType==='gradient'?'active':''}" onclick="updateStyle('${el.id}','bgType','gradient');renderInspector();">Degradado</button>
      </div>`;
      if(s.bgType==='solid'){
        html += colorControl(el.id,'bg','Color de fondo',s.bg,`v=>updateStyle('${el.id}','bg',v)`);
      }else{
        html += colorControl(el.id,'gradientFrom','Color inicial',s.gradientFrom,`v=>updateStyle('${el.id}','gradientFrom',v)`);
        html += colorControl(el.id,'gradientTo','Color final',s.gradientTo,`v=>updateStyle('${el.id}','gradientTo',v)`);
      }
    }
    if(sp.includes('color')){
      html += `<div class="section-title">Texto</div>`;
      html += colorControl(el.id,'color','Color de texto',s.color,`v=>updateStyle('${el.id}','color',v)`);
    }
    if(sp.includes('fontSize') || sp.includes('fontWeight')){
      html += `<div class="row2">`;
      if(sp.includes('fontSize')) html += `<div>${rangeControl(el.id,'fontSize','Tamaño',s.fontSize,10,60,1,`v=>updateStyle('${el.id}','fontSize',v)`,'px')}</div>`;
      if(sp.includes('fontWeight')){
        html += `<div><label class="field-label">Grosor</label>
        <select class="select-input" onchange="updateStyle('${el.id}','fontWeight',this.value)">
          ${['400','500','600','700','800'].map(w=>`<option value="${w}" ${s.fontWeight==w?'selected':''}>${w}</option>`).join('')}
        </select></div>`;
      }
      html += `</div>`;
    }
    html += `<div class="section-title">Espaciado y forma</div>`;
    html += `<div class="row2">
      ${rangeControl(el.id,'paddingV','Relleno vertical',s.paddingV,0,80,1,`v=>updateStyle('${el.id}','paddingV',v)`,'px')}
      ${rangeControl(el.id,'paddingH','Relleno horizontal',s.paddingH,0,80,1,`v=>updateStyle('${el.id}','paddingH',v)`,'px')}
    </div>`;
    html += rangeControl(el.id,'radius','Bordes redondeados',s.radius,0,999,1,`v=>updateStyle('${el.id}','radius',v)`,'px');
    if(sp.includes('border')){
      html += `<div class="row2">
        ${rangeControl(el.id,'borderWidth','Grosor de borde',s.borderWidth,0,8,1,`v=>updateStyle('${el.id}','borderWidth',v)`,'px')}
        <div>${colorControl(el.id,'borderColor','Color de borde',s.borderColor,`v=>updateStyle('${el.id}','borderColor',v)`)}</div>
      </div>`;
    }
    if(sp.includes('shadow')){
      html += `<label class="field-label">Sombra</label><div class="chip-select">`;
      html += Object.keys(SHADOWS).map(k=>`<button class="${s.shadow===k?'active':''}" onclick="updateStyle('${el.id}','shadow','${k}');renderInspector();">${SHADOW_LABELS[k]}</button>`).join('');
      html += `</div>`;
    }
    if(sp.includes('width')){
      html += `<label class="field-label">Ancho</label><div class="chip-select">
        <button class="${s.width==='auto'?'active':''}" onclick="updateStyle('${el.id}','width','auto');renderInspector();">Auto</button>
        <button class="${s.width==='custom'?'active':''}" onclick="updateStyle('${el.id}','width','custom');renderInspector();">Fijo</button>
        <button class="${s.width==='full'?'active':''}" onclick="updateStyle('${el.id}','width','full');renderInspector();">100%</button>
      </div>`;
      if(s.width==='custom'){
        html += rangeControl(el.id,'widthPx','Ancho fijo',s.widthPx,100,900,10,`v=>updateStyle('${el.id}','widthPx',v)`,'px');
      }
    }
    if(sp.includes('align')){
      html += `<label class="field-label">Alineación de texto</label><div class="chip-select">
        <button class="${s.align==='left'?'active':''}" onclick="updateStyle('${el.id}','align','left');renderInspector();">Izquierda</button>
        <button class="${s.align==='center'?'active':''}" onclick="updateStyle('${el.id}','align','center');renderInspector();">Centro</button>
        <button class="${s.align==='right'?'active':''}" onclick="updateStyle('${el.id}','align','right');renderInspector();">Derecha</button>
      </div>`;
    }
    body.innerHTML = html;
    return;
  }

  if(activeTab==='animacion'){
    const a = el.animation, h = el.hover;
    let html = `<div class="section-title">Animación de entrada</div>`;
    html += `<select class="select-input" onchange="updateAnim('${el.id}','name',this.value);renderInspector();">`;
    html += Object.keys(ANIM_LABELS).map(k=>`<option value="${k}" ${a.name===k?'selected':''}>${ANIM_LABELS[k]}</option>`).join('');
    html += `</select>`;
    if(a.name!=='none'){
      html += rangeControl(el.id,'aDuration','Duración',a.duration,0.1,3,0.1,`v=>updateAnim('${el.id}','duration',v)`,'s');
      html += rangeControl(el.id,'aDelay','Retraso',a.delay,0,2,0.1,`v=>updateAnim('${el.id}','delay',v)`,'s');
      html += `<label class="field-label">Curva de animación</label>
      <select class="select-input" onchange="updateAnim('${el.id}','timing',this.value)">
        ${['ease','ease-in','ease-out','ease-in-out','linear'].map(t=>`<option value="${t}" ${a.timing===t?'selected':''}>${t}</option>`).join('')}
      </select>`;
      html += `<label class="field-label">Repetición</label><div class="chip-select">
        <button class="${a.iteration==='1'?'active':''}" onclick="updateAnim('${el.id}','iteration','1');renderInspector();">Una vez</button>
        <button class="${a.iteration==='infinite'?'active':''}" onclick="updateAnim('${el.id}','iteration','infinite');renderInspector();">Infinito</button>
      </div>`;
    }
    html += `<div class="section-title">Efecto al pasar el cursor (hover)</div>`;
    html += `<select class="select-input" onchange="updateHover('${el.id}','effect',this.value);renderInspector();">`;
    html += Object.keys(HOVER_LABELS).map(k=>`<option value="${k}" ${h.effect===k?'selected':''}>${HOVER_LABELS[k]}</option>`).join('');
    html += `</select>`;
    if(h.effect!=='none'){
      html += rangeControl(el.id,'hDuration','Duración de transición',h.duration,0.1,1.5,0.05,`v=>updateHover('${el.id}','duration',v)`,'s');
    }
    html += `<div class="hint-box">💡 Prueba pasar el cursor sobre el elemento en el lienzo para ver el efecto hover, y espera a que cargue para ver la animación de entrada.</div>`;
    body.innerHTML = html;
    return;
  }
}

/* ============================= DEVICE / GLOBAL RENDER ============================= */
function setDevice(d){
  device = d;
  document.querySelectorAll('#deviceToggle button').forEach(b=>b.classList.toggle('active', b.dataset.d===d));
  renderCanvas();
}
function renderAll(){
  renderCatTabs();
  renderPalette();
  renderLayers();
  renderCanvas();
  renderInspector();
}

/* ============================= CODE MODAL ============================= */
function openCode(){
  document.getElementById('modalOverlay').classList.add('open');
  switchCodeTab(activeCodeTab);
}
function closeCode(){ document.getElementById('modalOverlay').classList.remove('open'); }
function switchCodeTab(tab){
  activeCodeTab = tab;
  document.querySelectorAll('#codeTabs button').forEach(b=>b.classList.toggle('active', b.dataset.c===tab));
  const view = document.getElementById('codeView');
  if(tab==='combinado') view.textContent = generateCombined();
  else if(tab==='html') view.textContent = generateHTML();
  else view.textContent = generateCSS();
}
function copyCode(){
  const text = document.getElementById('codeView').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = '✓ Copiado';
    setTimeout(()=>btn.textContent=old, 1400);
  }).catch(()=>{ alert('No se pudo copiar automáticamente. Selecciona el texto manualmente.'); });
}
function downloadFile(filename, content, type){
  const blob = new Blob([content], {type: type||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadCombined(){
  if(!elements.length){ alert('Añade al menos un elemento antes de descargar.'); return; }
  downloadFile('mi-sitio-xanda.html', generateCombined(), 'text/html');
}
function downloadSeparate(){
  if(!elements.length){ alert('Añade al menos un elemento antes de descargar.'); return; }
  const htmlDoc = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi sitio — XandA Builder</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body style="padding:40px;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px;">
${generateHTML()}
</body>
</html>`;
  downloadFile('index.html', htmlDoc, 'text/html');
  setTimeout(()=>downloadFile('estilos.css', generateCSS(), 'text/css'), 300);
}

/* ============================= INIT ============================= */
window.addEventListener('message', (e)=>{
  if(e.data && e.data.type==='select'){ selectElement(e.data.id); }
});

function init(){
  renderCatTabs();
  renderPalette();
  // starter element so the canvas isn't empty on first load
  addElement('sec-hero');
}
init();
</script>
